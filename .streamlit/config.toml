# 앱 화면 테마: 교재와 같은 파란색(#0047AB)과 둥근 모서리로 통일 (CSS 없이 Streamlit 기본 기능만 사용해 성능 영향 없음)
[theme]
base = "light"
primaryColor = "#0047AB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F6FB"
textColor = "#0F172A"
borderColor = "#DCE3EE"
showWidgetBorder = true
baseRadius = "0.6rem"
buttonRadius = "0.6rem"
redColor = "#E11D48"

[global]
# 다른 메뉴로 갔다 와도 입력값을 유지하는 코드(keep_widget_state) 때문에 뜨는 안내 경고를 끔
disableWidgetStateDuplicationWarning = true
